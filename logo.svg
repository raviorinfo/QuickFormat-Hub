<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Top-Right Cyan Highlight Gradient -->
    <radialGradient id="highlightGrad" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Glow for Lightning Bolt -->
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Shadow for Card -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>

    <!-- Green Dot Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Main Squircle Card -->
  <g filter="url(#cardShadow)">
    <rect
      x="8"
      y="8"
      width="74"
      height="74"
      rx="20"
      ry="20"
      fill="url(#bgGrad)"
      stroke="#38bdf8"
      stroke-width="1.5"
    />
    <!-- Highlight Overlay -->
    <rect
      x="8"
      y="8"
      width="74"
      height="74"
      rx="20"
      ry="20"
      fill="url(#highlightGrad)"
    />
  </g>

  <!-- Lightning Bolt with Rounded Joint & Glow -->
  <g filter="url(#boltGlow)">
    <path
      d="M51 24 L36 44 L44.5 45.5 L39 65 L57 43.5 L48 42 Z"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Inner bright core -->
    <path
      d="M51 24 L36 44 L44.5 45.5 L39 65 L57 43.5 L48 42 Z"
      fill="#f0f9ff"
      stroke="#f0f9ff"
      stroke-width="2"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
  </g>

  <!-- Bottom-Right Live Indicator Badge -->
  <!-- Outer Ring Cutout / Border -->
  <circle
    cx="76"
    cy="76"
    r="16"
    fill="#ffffff"
  />
  <!-- Inner Vibrant Green Dot -->
  <circle
    cx="76"
    cy="76"
    r="11"
    fill="url(#greenGrad)"
  />
  <!-- Subtle green dot specular highlight -->
  <circle
    cx="73.5"
    cy="73.5"
    r="3.5"
    fill="#ffffff"
    fill-opacity="0.45"
  />
</svg>
